---
# Role: common
# Applied to ALL nodes. Sets timezone, locale, installs base packages,
# writes /etc/hosts with topology IPs, and creates the student analyst user.

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Set locale
  ansible.builtin.copy:
    content: "LANG={{ common_locale }}\n"
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"

- name: Detect Kali APT repositories
  ansible.builtin.shell:
    cmd: grep -rqsiE 'kali\.(org|download)|kali-rolling' /etc/apt/sources.list /etc/apt/sources.list.d/
  register: kali_repo_present
  changed_when: false
  failed_when: false

- name: Install Kali archive signing key (offline, vendored)
  ansible.builtin.copy:
    src: kali-archive-keyring.gpg
    dest: /etc/apt/trusted.gpg.d/kali-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  when: kali_repo_present.rc == 0

- name: Update apt cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install common packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present

- name: Write /etc/hosts with topology hostnames
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
  when: common_hostname_in_hosts | bool

- name: Create student analyst user
  ansible.builtin.user:
    name: "{{ student_user }}"
    password: "{{ student_password_hash }}"
    shell: /bin/bash
    groups: sudo
    append: true
    state: present

- name: Inject platform SSH public key for student user
  ansible.posix.authorized_key:
    user: "{{ student_user }}"
    key: "{{ lookup('file', global_ssh_public_user_key) }}"
    state: present
  when: global_ssh_public_user_key is defined and global_ssh_public_user_key | length > 0

- name: Allow analyst sudo without password (training environment)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ student_user }}"
    content: "{{ student_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: Ensure getty override dirs exist (console autologin as student user)
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    mode: "0755"
  loop:
    - getty@tty1.service
    - serial-getty@ttyS0.service

- name: Configure console autologin as student user (tty1)
  ansible.builtin.copy:
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin {{ student_user }} --noclear %I $TERM

- name: Configure console autologin as student user (serial ttyS0)
  ansible.builtin.copy:
    dest: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin {{ student_user }} --keep-baud 115200,57600,38400,9600 %I $TERM

- name: Reload systemd unit files (pick up getty autologin overrides)
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart console getty so autologin applies without a reboot
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - getty@tty1.service
    - serial-getty@ttyS0.service
  failed_when: false

- name: Set MOTD with scenario banner
  ansible.builtin.copy:
    dest: /etc/motd
    content: |
      ============================================================
        {{ scenario_name }}
        CyberRangeCZ/KYPO  |  Sandbox: {{ global_sandbox_name | default('dev') }}
        Role: {{ inventory_hostname }}
      ============================================================
    mode: "0644"
